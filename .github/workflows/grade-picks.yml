# Califica los picks con los marcadores de ESPN y reconstruye el sitio.
name: grade-picks

on:
  schedule:
    # Los cron de GitHub van en UTC. 12:45 UTC = 06:45 hora CDMX (America/Mexico_City, UTC-6 todo el año).
    - cron: "45 12 * * 6"   # sábado 06:45 CDMX: califica el juego del jueves (TNF)
    - cron: "45 12 * * 2"   # martes 06:45 CDMX: califica domingo y lunes
  workflow_dispatch:

permissions:
  contents: write

# Evita que build-site y grade-picks empujen al mismo tiempo.
concurrency:
  group: mazopicks-data
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    env:
      TZ: America/Mexico_City
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests

      - name: Calificar picks (si ESPN falla, quedan en null)
        run: python scripts/grade_picks.py

      - name: Construir docs/data
        run: python scripts/build_site.py

      - name: Commit y push si hay cambios
        run: |
          if [ -z "$(git status --porcelain -- data docs)" ]; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data docs
          git commit -m "grade: picks calificados [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
